name: Upload To ECR

on:
  workflow_call:
    secrets:
      ACCOUNT_ID:
        required: true
    inputs:
      GHCR_IMAGE:
        required: true
        type: string
      ASSUME_ROLE:
        required: true
        type: string
      AWS_REGION:
        required: true
        type: string
      ECR_IMAGE_NAME:
        required: true
        type: string

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  upload-ghcr-ecr:
    runs-on: ubuntu-latest #self-hosted
    env:
      ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "[+] Current tags: ${VERSION}, latest"
            echo "tags=${VERSION},latest" >> $GITHUB_OUTPUT
          else
            echo "[+] Current tag: latest"
            echo "tags=latest" >> $GITHUB_OUTPUT
          fi

      - name: Pull GHCR container image
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          PRIMARY_TAG=$(echo "$TAGS" | cut -d',' -f1)

          docker pull ${{ inputs.GHCR_IMAGE }}:$PRIMARY_TAG

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT_ID }}:role/${{ inputs.ASSUME_ROLE }}
          aws-region: ${{ inputs.AWS_REGION }}

      - name: Push image to ECR
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          PRIMARY_TAG=$(echo "$TAGS" | cut -d',' -f1)
          IFS=',' read -ra TAG_ARRAY <<< "$TAGS"

          aws ecr describe-repositories --repository-names ${{ inputs.ECR_IMAGE_NAME }} || \
            aws ecr create-repository --repository-name ${{ inputs.ECR_IMAGE_NAME }}

          docker login \
            --username AWS \
            --password $(aws ecr get-login-password --region ${{ inputs.AWS_REGION }}) \
            $ACCOUNT_ID.dkr.ecr.${{ inputs.AWS_REGION }}.amazonaws.com

          for TAG in "${TAG_ARRAY[@]}"; do
            echo "[+] Tagging and pushing: $TAG"

            docker tag ${{ inputs.GHCR_IMAGE }}:$PRIMARY_TAG \
              $ACCOUNT_ID.dkr.ecr.${{ inputs.AWS_REGION }}.amazonaws.com/${{ inputs.ECR_IMAGE_NAME }}:$TAG

            docker push $ACCOUNT_ID.dkr.ecr.${{ inputs.AWS_REGION }}.amazonaws.com/${{ inputs.ECR_IMAGE_NAME }}:$TAG
          done